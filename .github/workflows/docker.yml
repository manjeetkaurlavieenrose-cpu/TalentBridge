# Builds the container image, starts it, checks that the app answers, and publishes it to GitHub's free container registry
# (ghcr.io/<owner>/<repo>) so any server can run it with one command. Also proves on every upload that the image really works.
name: docker
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t "$IMAGE:latest" .
      - name: Start it and check that it answers
        run: |
          docker run -d --name tb -p 8000:8000 -e DEMO_SEED=1 "$IMAGE:latest"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then echo "app is up"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/ | grep -q "TalentBridge"
          curl -fsSI http://localhost:8000/js/app.js | grep -i "content-type: text/javascript"
          docker logs tb | tail -20
      - name: Publish to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
